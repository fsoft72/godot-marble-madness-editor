[preset.0]

name="Web Player"
platform="Web"
runnable=true
dedicated_server=false
custom_features="player"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="scenes/editor.tscn,scripts/editor/*,scripts/ui/editor_ui.gd,tests/*,tools/*,docs/*,assets/*"
export_path="build/web/index.html"

[preset.0.options]

variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false

[preset.1]

name="Linux Player"
platform="Linux"
runnable=true
dedicated_server=false
custom_features="player"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="scenes/editor.tscn,scripts/editor/*,scripts/ui/editor_ui.gd,tests/*,tools/*,docs/*,assets/*"
export_path="build/linux/marble-madness.x86_64"

[preset.1.options]

binary_format/embed_pck=true
